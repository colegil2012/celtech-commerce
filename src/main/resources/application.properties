# ===================================================
# CelTech Commerce API - Application Configuration
# ===================================================

spring.application.name=celtech-commerce

# -----------------------------------------------
# Server
# -----------------------------------------------
server.port=8080

# -----------------------------------------------
# PostgreSQL DataSource
# -----------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/celtech_commerce}
spring.datasource.username=${DB_USERNAME:your_db_username}
spring.datasource.******
spring.datasource.driver-class-name=org.postgresql.Driver

# -----------------------------------------------
# JPA / Hibernate
# -----------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# -----------------------------------------------
# Stripe
# -----------------------------------------------
# Set STRIPE_SECRET_KEY environment variable in production
stripe.api.secret-key=${STRIPE_SECRET_KEY:sk_test_replace_me}
# Set STRIPE_WEBHOOK_SECRET environment variable in production
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_replace_me}

# -----------------------------------------------
# Security
# -----------------------------------------------
spring.security.user.name=${SECURITY_USER}
spring.security.user.******
